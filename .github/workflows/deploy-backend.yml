name: Deploy FastAPI to Vercel

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Link Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          SCOPE_FLAG=""
          if [ -n "$VERCEL_ORG_ID" ]; then
            SCOPE_FLAG="--scope $VERCEL_ORG_ID"
          fi
          vercel link --yes --project "$VERCEL_PROJECT_ID" $SCOPE_FLAG --token "$VERCEL_TOKEN"

      - name: Deploy to Vercel production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -o pipefail
          SCOPE_FLAG=""
          if [ -n "$VERCEL_ORG_ID" ]; then
            SCOPE_FLAG="--scope $VERCEL_ORG_ID"
          fi
          vercel deploy --prod --yes $SCOPE_FLAG --token "$VERCEL_TOKEN" 2>&1 | tee deploy.log
          deployment_url="$(grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' deploy.log | tail -n 1)"
          if [ -z "$deployment_url" ]; then
            echo "Vercel did not return a deployment URL."
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "### Vercel Backend Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Deployed URL:** \`$deployment_url\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify FastAPI and Supabase health
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "Verifying health endpoints on $DEPLOYMENT_URL"
          curl --fail --silent --show-error --retry 10 --retry-delay 5 --retry-connrefused "$DEPLOYMENT_URL/health"
          health="$(curl --fail --silent --show-error --retry 10 --retry-delay 5 --retry-connrefused "$DEPLOYMENT_URL/health/db")"
          printf '%s' "$health" | grep -Fq '"database":"supabase"' || {
            echo "Vercel is up, but Supabase health is not ready. Check Vercel environment variables."
            exit 1
          }
          echo "- **Health Endpoint:** \`$DEPLOYMENT_URL/health\` (200 OK)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Database Connectivity:** \`$DEPLOYMENT_URL/health/db\` ($health)" >> "$GITHUB_STEP_SUMMARY"